[project]
name = "padel-cv"
version = "0.1.0"
description = "Computer vision pipeline: court, players, pose, shot classification"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ultralytics>=8.4",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "imageio>=2.36",
    "imageio-ffmpeg>=0.5",  # bundles a static ffmpeg: H.264 output, no system dep
]

[project.scripts]
padel-cv = "padel_cv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padel_cv"]
