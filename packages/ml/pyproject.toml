[project]
name = "padel-ml"
version = "0.1.0"
description = "Shot classification models (ST-GCN and modern comparison)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padel_ml"]
