[project]
name = "padel-ml"
version = "0.1.0"
description = "Shot classification models (ST-GCN and modern comparison)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.5",
    "torchaudio>=2.5",  # log-Mel spectrogram of the audio hit detector
    "numpy>=1.26",
    "matplotlib>=3.9",
    "mlflow>=2.16",
    "padel-cv",
]

[tool.uv.sources]
padel-cv = { workspace = true }

[project.scripts]
padel-ball-train = "padel_ml.ball_train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padel_ml"]
