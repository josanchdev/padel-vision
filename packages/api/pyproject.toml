[project]
name = "padel-api"
version = "0.1.0"
description = "FastAPI service exposing the padel analysis pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "arq>=0.26",
    "redis>=5.2",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padel_api"]

[[tool.mypy.overrides]]
module = ["arq.*", "aiofiles.*"]
ignore_missing_imports = true
