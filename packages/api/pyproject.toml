[project]
name = "padel-api"
version = "0.1.0"
description = "FastAPI service exposing the padel analysis pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padel_api"]
