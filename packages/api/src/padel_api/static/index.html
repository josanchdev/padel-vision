<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Padel Vision — scaffold</title>
    <style>
      :root { --bg: #0f1115; --panel: #181b22; --line: #262b36; --fg: #e7ebf0;
              --muted: #8a94a6; --accent: #3ba776; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg);
             color: var(--fg); }
      header { padding: 20px 24px; border-bottom: 1px solid var(--line); }
      header h1 { margin: 0; font-size: 18px; font-weight: 600; }
      header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      main { max-width: 900px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
               padding: 20px; }
      #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 36px;
              text-align: center; color: var(--muted); cursor: pointer; transition: .15s; }
      #drop.over { border-color: var(--accent); color: var(--fg); }
      .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
      .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 500; }
      .tag { font-size: 12px; padding: 2px 8px; border-radius: 20px; background: var(--line); }
      .tag.done { background: #143d2b; color: #6ee7a8; }
      .tag.failed { background: #3d1414; color: #f39; }
      button { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
               padding: 8px 14px; font-size: 14px; cursor: pointer; }
      video { width: 100%; border-radius: 8px; margin-top: 12px; background: #000; }
      a { color: var(--accent); }
      /* --- Shot table + modal (functional mockup; styling will be redesigned) --- */
      .filters { display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
                 margin-bottom: 12px; font-size: 13px; color: var(--muted); }
      .chip { padding: 3px 10px; border: 1px solid var(--line); border-radius: 20px;
              background: transparent; color: var(--fg); cursor: pointer; font-size: 12px; }
      .chip.off { opacity: .35; }
      tr.shot-row { cursor: pointer; }
      tr.shot-row:hover { background: var(--line); }
      td.low { color: var(--muted); }
      .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.7);
                        display: none; align-items: center; justify-content: center; z-index: 10; }
      .modal-backdrop.open { display: flex; }
      .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
               padding: 16px; width: min(820px, 92vw); }
      .modal-head { display: flex; justify-content: space-between; align-items: center;
                    margin-bottom: 10px; }
      .modal-head .x { background: transparent; color: var(--muted); font-size: 20px;
                       padding: 0 6px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Padel Vision</h1>
      <p>Sube un partido: obtén el vídeo analizado, la tabla de golpes y el clip de cada golpe.</p>
    </header>
    <main>
      <div class="panel">
        <div id="drop">Arrastra un vídeo aquí o haz clic para elegir</div>
        <input id="file" type="file" accept="video/*" hidden />
        <div id="active" style="margin-top:16px; display:none;">
          <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;">
            <span id="active-name"></span><span id="active-pct">0%</span>
          </div>
          <div class="bar"><div id="active-bar"></div></div>
        </div>
      </div>

      <div class="panel">
        <h3 style="margin:0 0 12px; font-size:15px;">Partidos</h3>
        <table>
          <thead><tr><th>Archivo</th><th>Estado</th><th>Golpes</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="panel" id="player-panel" style="display:none;">
        <h3 style="margin:0 0 4px; font-size:15px;">Resultado</h3>
        <video id="player" controls></video>
      </div>

      <div class="panel" id="shots-panel" style="display:none;">
        <h3 style="margin:0 0 12px; font-size:15px;">Tabla de golpes</h3>
        <div class="filters">
          <span>Jugador</span>
          <span id="player-chips"></span>
          <span>Tipo</span>
          <span id="type-chips"></span>
        </div>
        <table>
          <thead><tr><th>Minuto</th><th>Jugador</th><th>Tipo</th><th>Confianza</th></tr></thead>
          <tbody id="shot-rows"></tbody>
        </table>
      </div>
    </main>

    <div class="modal-backdrop" id="modal">
      <div class="modal">
        <div class="modal-head">
          <strong id="modal-title"></strong>
          <button class="x" onclick="closeModal()">&times;</button>
        </div>
        <video id="modal-video" controls autoplay></video>
        <div style="font-size:12px; color:var(--muted); margin-top:8px;" id="modal-meta"></div>
      </div>
    </div>

    <script>
      const drop = document.getElementById("drop");
      const fileInput = document.getElementById("file");
      const active = document.getElementById("active");

      drop.onclick = () => fileInput.click();
      drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
      drop.ondragleave = () => drop.classList.remove("over");
      drop.ondrop = (e) => {
        e.preventDefault();
        drop.classList.remove("over");
        if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
      };
      fileInput.onchange = () => fileInput.files[0] && upload(fileInput.files[0]);

      async function upload(file) {
        const body = new FormData();
        body.append("video", file);
        active.style.display = "block";
        document.getElementById("active-name").textContent = file.name;
        setProgress(0);
        const res = await fetch("/matches", { method: "POST", body });
        if (!res.ok) { alert("Error al subir: " + res.status); return; }
        const match = await res.json();
        track(match.id);
        refresh();
      }

      function setProgress(p) {
        document.getElementById("active-bar").style.width = p * 100 + "%";
        document.getElementById("active-pct").textContent = Math.round(p * 100) + "%";
      }

      async function track(id) {
        const state = await (await fetch(`/matches/${id}`)).json();
        setProgress(state.progress);
        refresh();
        if (state.status === "done") { active.style.display = "none"; play(id); }
        else if (state.status === "failed") { alert("Falló: " + state.error); active.style.display = "none"; }
        else setTimeout(() => track(id), 1500);
      }

      // --- API layer: all backend calls live here. This is the part that
      // survives a visual redesign; the rendering below is throwaway skin. ---
      const api = {
        matches: () => fetch("/matches").then((r) => r.json()),
        data: (id) => fetch(`/matches/${id}/data`).then((r) => r.json()),
        resultUrl: (id) => `/matches/${id}/result`,
        clipUrl: (id, frame) => `/matches/${id}/clip?frame=${frame}`,
      };

      function play(id) {
        document.getElementById("player-panel").style.display = "block";
        const p = document.getElementById("player");
        p.src = api.resultUrl(id);
        p.scrollIntoView({ behavior: "smooth" });
        loadShots(id);
      }

      // --- Shot table: fetch structured data, render, filter, open clip modal ---
      let currentMatch = null;
      let shots = [];
      const activePlayers = new Set();
      const activeTypes = new Set();

      async function loadShots(id) {
        currentMatch = id;
        const data = await api.data(id);
        shots = data.shots || [];
        activePlayers.clear();
        activeTypes.clear();
        for (const s of shots) { activePlayers.add(s.player_id); activeTypes.add(s.label); }
        renderChips();
        renderShots();
        document.getElementById("shots-panel").style.display = shots.length ? "block" : "none";
      }

      function renderChips() {
        const players = [...new Set(shots.map((s) => s.player_id))].sort();
        const types = [...new Set(shots.map((s) => s.label))].sort();
        const chip = (label, on, onclick) =>
          `<button class="chip ${on ? "" : "off"}" onclick="${onclick}">${label}</button>`;
        document.getElementById("player-chips").innerHTML =
          players.map((p) => chip("J" + p, activePlayers.has(p), `togglePlayer(${p})`)).join(" ");
        document.getElementById("type-chips").innerHTML =
          types.map((t) => chip(t, activeTypes.has(t), `toggleType('${t}')`)).join(" ");
      }

      function togglePlayer(p) {
        activePlayers.has(p) ? activePlayers.delete(p) : activePlayers.add(p);
        renderChips(); renderShots();
      }
      function toggleType(t) {
        activeTypes.has(t) ? activeTypes.delete(t) : activeTypes.add(t);
        renderChips(); renderShots();
      }

      function fmtTime(s) {
        const m = Math.floor(s / 60), sec = (s % 60).toFixed(1).padStart(4, "0");
        return `${String(m).padStart(2, "0")}:${sec}`;
      }

      function renderShots() {
        const visible = shots.filter(
          (s) => activePlayers.has(s.player_id) && activeTypes.has(s.label)
        );
        document.getElementById("shot-rows").innerHTML = visible.map((s) => {
          const low = s.confidence < 0.5 ? "low" : "";
          return `<tr class="shot-row" onclick="openClip(${s.frame_index}, ${s.player_id}, '${s.label}', ${s.timestamp_s})">
            <td class="${low}">${fmtTime(s.timestamp_s)}</td>
            <td class="${low}">J${s.player_id}</td>
            <td class="${low}">${s.label}</td>
            <td class="${low}">${s.confidence.toFixed(2)}</td>
          </tr>`;
        }).join("");
      }

      function openClip(frame, player, label, ts) {
        document.getElementById("modal-title").textContent = `J${player} · ${label} · ${fmtTime(ts)}`;
        document.getElementById("modal-meta").textContent = `frame ${frame} · clip 3s antes / 3s después`;
        document.getElementById("modal-video").src = api.clipUrl(currentMatch, frame);
        document.getElementById("modal").classList.add("open");
      }
      function closeModal() {
        document.getElementById("modal").classList.remove("open");
        document.getElementById("modal-video").src = "";
      }
      document.getElementById("modal").onclick = (e) => {
        if (e.target.id === "modal") closeModal();
      };

      async function refresh() {
        const matches = await (await fetch("/matches")).json();
        document.getElementById("rows").innerHTML = matches.map((m) => `
          <tr>
            <td>${m.filename}</td>
            <td><span class="tag ${m.status}">${m.status} ${m.status === "processing" ? Math.round(m.progress*100)+"%" : ""}</span></td>
            <td>${m.status === "done" ? m.shots_detected : "—"}</td>
            <td>${m.status === "done" ? `<button onclick="play('${m.id}')">Ver</button>` : ""}</td>
          </tr>`).join("");
      }

      refresh();
      setInterval(refresh, 4000);
    </script>
  </body>
</html>
