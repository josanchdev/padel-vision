[project]
name = "padel-vision"
version = "0.1.0"
description = "Automatic padel match analysis with computer vision (TFG, URJC)"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/cv", "packages/ml"]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.14",
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["padel_cv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = ["packages/cv/src", "packages/ml/src"]
packages = ["padel_cv", "padel_ml"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "ultralytics", "ultralytics.*", "imageio", "imageio.*", "imageio_ffmpeg", "torchaudio", "torchaudio.*"]
ignore_missing_imports = true
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["packages/cv/tests", "packages/ml/tests"]
addopts = "-q"
