# Full Level-1 stack (ADR-0007). Redis backs the queue and match store; the API
# accepts uploads and the GPU worker runs the CV pipeline. For local iteration
# without containerizing the GPU services, `tools/dev.sh` runs api+worker native
# against just the redis service here.
services:
  redis:
    image: redis:8-alpine
    container_name: padel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    image: padel-vision:local
    container_name: padel_api
    depends_on:
      redis:
        condition: service_healthy
    environment: &backend_env
      PADEL_REDIS_URL: redis://redis:6379
      PADEL_STORAGE_DIR: /app/storage
      PADEL_COURT_MODEL: /app/models/court_broadcast_v6.pt
    volumes: &backend_volumes
      - ./storage:/app/storage
      - ./runs/archive:/app/models:ro
      # Serve the live static frontend so web edits show without an image rebuild.
      - ./packages/api/src/padel_api/static:/app/packages/api/src/padel_api/static:ro
    ports:
      - "8000:8000"

  worker:
    build: .
    image: padel-vision:local
    container_name: padel_worker
    depends_on:
      redis:
        condition: service_healthy
    environment: *backend_env
    volumes: *backend_volumes
    command: ["arq", "padel_api.worker.WorkerSettings"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  redis_data:
