# Infrastructure for local development (ADR-0007).
#
# Redis backs both the Arq job queue and the match store. The API and the GPU
# worker run natively during development (`tools/dev.sh`) so the pipeline uses
# the host GPU directly; containerizing them is the final packaging step.
services:
  redis:
    image: redis:8-alpine
    container_name: padel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
